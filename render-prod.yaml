services:
  # Backend Web Service - TEST
  - type: web
    name: gestionale-backend-test
    runtime: node
    region: frankfurt
    plan: free
    branch: feature/preventivo-trasferta
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        sync: false
      - key: PORT
        sync: false
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/health
